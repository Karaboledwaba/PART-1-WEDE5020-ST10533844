<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowTech Plumbers | Request a Service</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo"><strong>FlowTech Plumbers</strong></div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html">Online Enquiry</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="enquiry-intro">
            <h1>Request Professional Service</h1>
            <p>Fill out the details below for a fast, obligation-free quote in Johannesburg.</p>
        </section>

        <!-- Aesthetic and Accessible Form -->
        <form id="enquiryForm" action="#" method="POST" novalidate>
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required placeholder="e.g. John Smith">
                <span class="error-msg" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required placeholder="012 345 6789">
            </div>

            <div class="form-group">
                <label for="serviceType">Service Required</label>
                <select id="serviceType" name="serviceType" required>
                    <option value="" disabled selected>Select a service...</option>
                    <option value="emergency">Emergency Repair (24/7)</option>
                    <option value="leak">Leak Detection</option>
                    <option value="geyser">Geyser Maintenance</option>
                    <option value="drain">Blocked Drains</option>
                </select>
            </div>

            <div class="form-group">
                <label for="preferredDate">Preferred Appointment Date</label>
                <input type="date" id="preferredDate" name="preferredDate" required>
            </div>

            <div class="form-group">
                <label for="details">Additional Details</label>
                <textarea id="details" name="details" rows="4" placeholder="Describe your plumbing issue..."></textarea>
            </div>

            <button type="submit" class="cta-button">Submit Booking Request</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 FlowTech Plumbers. All Rights Reserved.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
